[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/storage",
    "crates/git",
    "crates/env",
    "crates/context",
    "crates/observer",
    "crates/adapters",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
ignore = "0.4"
