name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p ctx --target ${{ matrix.target }}
      - name: package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ctx-${{ matrix.target }}.tar.gz ctx
          mv ctx-${{ matrix.target }}.tar.gz ../../../
      - name: package (windows)
        if: matrix.ext == 'zip'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/ctx.exe -DestinationPath ctx-${{ matrix.target }}.zip
      - name: upload
        uses: softprops/action-gh-release@v2
        with:
          files: ctx-${{ matrix.target }}.${{ matrix.ext }}
          generate_release_notes: true
